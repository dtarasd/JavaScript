<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Memoization Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h3>Тестування бібліотеки мемоізації</h3>

<div class="controls">
    <button id="btn-fib">Бенчмарк: Fibonacci (LRU Cache)</button>
    <button id="btn-with">Тест: Custom Key (memoizeWith)</button>
    <button id="btn-async">Тест: Async API</button>
    <button id="btn-ttl">Тест: Expiring Cache (TTL)</button>
</div>

<div id="output" class="output-box">
    Натисни на кнопки вище, щоб запустити тести та побачити бенчмарки.
</div>

<script src="script.js"></script>
</body>
</html>
