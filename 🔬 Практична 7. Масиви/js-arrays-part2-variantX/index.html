<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h3>Трекер завдань</h3>
<div class="controls">
    <input type="text" id="t-title" placeholder="Назва завдання">
    <select id="t-priority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
    </select>
    <input type="date" id="t-date">
    <button id="btn-add">Додати задачу</button>
</div>

<div class="controls" style="margin-top: 10px;">
    <button id="btn-stats">Показати статистику</button>
    <button id="btn-test">Тест трансформацій (F12)</button>
</div>

<div id="stats-output" style="margin-top: 10px; color: green;"></div>
<div id="output" style="margin-top: 20px;"></div>

<script src="script.js"></script>
</body>
</html>
