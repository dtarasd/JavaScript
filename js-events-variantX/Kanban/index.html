<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<button id="add-btn">Додати задачу</button>
<div class="board">
    <div class="column" id="todo">
        <h3>To Do</h3>
    </div>
    <div class="column" id="in-progress">
        <h3>In Progress</h3>
    </div>
    <div class="column" id="done">
        <h3>Done</h3>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
