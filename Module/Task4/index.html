<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>TodoList</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #taskInput { padding: 8px; width: 200px; }
        #addBtn { padding: 8px 15px; cursor: pointer; }

        /* Стилізація списку */
        #taskList { list-style-type: none; padding: 0; margin-top: 20px; }
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid #ddd;
            max-width: 300px;
        }
        .task-text { cursor: pointer; flex-grow: 1; }
        .done { text-decoration: line-through; color: #888; }
        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<input id="taskInput" placeholder="Нове завдання">
<button id="addBtn">Додати</button>
<ul id="taskList"></ul>

<script src="TodoList.js"></script>
</body>
</html>
